aid: beanstalk-app

name: Beanstalk

image: https://beanstalkapp.com/images/apple-touch-icon-144x144-precomposed.png

description: Beanstalk provides a complete workflow platform for writing, reviewing, and deploying code, supporting both Git and SVN repositories.
  It offers features like branch management, code reviews, permissions, notifications, and integrations, serving over 70,000 companies worldwide.
  The service includes pricing plans, support resources, and a status page for operational transparency.

